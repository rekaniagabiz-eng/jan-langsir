name: Bina blog

on:
  push:
    paths:
      - 'blog/posts/**'
      - 'blog/build.py'
  schedule:
    - cron: '5 16 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python blog/build.py
      - name: Commit hasil
        run: |
          git config user.name "blog-bot"
          git config user.email "blog-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "Kemas kini blog" && git push)
